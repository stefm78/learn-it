    - release_id_missing
    - impacted_core_missing
    - artifact_manifest_missing
    - validation_report_missing
    - compatibility_matrix_missing
    - rollback_or_reconciliation_path_missing
    - release_plan_references_unvalidated_core_mutation
    - single_core_release_attempted_for_cross_core_change

  future_release_surface:
    releases:
