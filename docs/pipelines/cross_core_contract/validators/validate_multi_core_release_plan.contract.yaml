      status_now: forbidden
      future_status: allowed_only_after_multi_core_release_plan_PASS
    current_manifest:
      path: docs/cores/current/manifest.yaml
      status_now: forbidden
      future_status: promotion_control_only_after_release_plan_PASS

  current_phase_guardrails:
