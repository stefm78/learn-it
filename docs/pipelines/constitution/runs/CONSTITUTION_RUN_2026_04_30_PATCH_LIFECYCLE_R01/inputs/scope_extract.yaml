      parameterizable: false
      human_readable: Tout patch hors bornes ou sans impact_scope calculable est rejeté intégralement.
      logic:
        trigger: Validation locale de patch
        condition: Paramètre hors fourchette ou impact_scope indéterminé.
        effect: Rejet total.
        scope: patch_validation
  - _source_core: constitution
    _source_section: INVARIANTS
    _matched_id: INV_PATCH_LOCAL_VALIDATION_MUST_BE_DETERMINISTIC
    entry:
      id: INV_PATCH_LOCAL_VALIDATION_MUST_BE_DETERMINISTIC
      authority: primary
      core_type: CONSTITUTION
      source_anchor: '[S14][PATCH_V5_0]'
      depends_on:
      - TYPE_PATCH_ARTIFACT
      - TYPE_PATCH_IMPACT_SCOPE
      - TYPE_PATCH_QUALITY_GATE
      relations:
      - type: constrains
        target:
          id: TYPE_PATCH_ARTIFACT
      patchable: false
      parameterizable: false
      human_readable: La validation locale d’un patch ne peut reposer que sur des critères déterministes.
      logic:
        trigger: Validation locale de patch
        condition: Un critère sémantique, pédagogique ou interprétatif est requis localement pour décider,
          ou la preuve de QA hors session ne peut pas être vérifiée par des critères strictement déterministes
          de présence, intégrité, portée, version, fraîcheur, empreintes de sources et statut déclaré.
        effect: État interdit ; le critère doit être déplacé dans la chaîne hors session de QA pédagogique.
          Le runtime local peut seulement vérifier déterministiquement la preuve précomputée et doit rejeter
          le patch si cette vérification échoue ou exige une interprétation.
        scope: patch_validation
  - _source_core: constitution
    _source_section: INVARIANTS
    _matched_id: INV_PERSISTENT_DRIFT_REQUIRES_ESCALATION_IF_PATCH_BLOCKED
    entry:
      id: INV_PERSISTENT_DRIFT_REQUIRES_ESCALATION_IF_PATCH_BLOCKED
      authority: primary
      core_type: CONSTITUTION
      source_anchor: '[S14][PATCH_V5_0]'
      depends_on:
      - TYPE_PATCH_ARTIFACT
      - INV_INVALID_PATCH_REJECTED
      relations: []
      patchable: false
      parameterizable: false
      human_readable: Une dérive persistante non corrigeable par patch localement valide doit être escaladée.
      logic:
        trigger: Répétition d'un besoin de correction sur plusieurs cycles
        condition: 'Condition primaire : le signal de dérive persiste alors que le patch requis reste
          rejeté, impossible ou bloqué par les contraintes de validation locale. Condition complémentaire
          : N patches successifs du même type ont été appliqués sans disparition du signal de dérive,
          où N est un paramètre externe du Référentiel. La production du signal de dérive reste hors du
          patch_lifecycle ; le patch_lifecycle traite uniquement l’échec, le blocage ou l’inefficacité
          des corrections par patch.'
        effect: Escalade obligatoire hors session vers la chaîne d’analyse/correction lorsque la dérive
          ne peut pas être résolue par patch local valide ou persiste malgré N applications valides successives.
          Cette escalade ne transfère pas au patch_lifecycle la propriété des signaux learner_state ou
          des régimes de détresse/conservatisme.
        scope: patch_governance
  - _source_core: constitution
    _source_section: INVARIANTS
    _matched_id: INV_PATCH_ARTIFACTS_MUST_BE_PRECOMPUTED_OFF_SESSION
    entry:
      id: INV_PATCH_ARTIFACTS_MUST_BE_PRECOMPUTED_OFF_SESSION
      authority: primary
      core_type: CONSTITUTION
      source_anchor: '[S13][S14][PATCH_V5_0]'
      depends_on:
      - TYPE_PATCH_ARTIFACT
      - INV_RUNTIME_FULLY_LOCAL
      - INV_NO_RUNTIME_CONTENT_GENERATION
      relations:
      - type: constrains
        target:
          id: TYPE_PATCH_ARTIFACT
      patchable: false
      parameterizable: false
      human_readable: Les artefacts de patch doivent être générés, validés et empaquetés hors session
        avant leur application locale.
      logic:
        trigger: Préparation d’un patch
        condition: Le patch nécessite calcul, QA ou génération d’artefact.
        effect: 'Préparation exclusivement hors session ; aucune génération, QA pédagogique ou validation
          distante pendant l’usage apprenant. L’artefact livré au runtime local doit inclure les métadonnées
          déterministes nécessaires à la vérification locale : impact_scope déclaré, empreintes de sources,
          version, fraîcheur/validité, statut de QA précomputée et preuve d’intégrité.'
        scope: patch_architecture
  - _source_core: constitution
    _source_section: RULES
    _matched_id: RULE_PERSISTENT_LOW_VC_TRIGGERS_RELEVANCE_PATCH
    entry:
      id: RULE_PERSISTENT_LOW_VC_TRIGGERS_RELEVANCE_PATCH
      authority: primary
      core_type: CONSTITUTION
      source_anchor: '[S17d]'
      depends_on:
      - TYPE_STATE_AXIS_VALUE_COST
      - REF_CORE_LEARNIT_REFERENTIEL_V5_0_IN_CONSTITUTION
      relations:
      - type: triggers
        target:
          id: ACTION_TRIGGER_RELEVANCE_PATCH
      patchable: false
      parameterizable: true
      human_readable: VC basse persistante déclenche un patch de relevance, pas une baisse de difficulté.
      logic:
        trigger: Persistance de VC basse
        condition: Seuil de persistance atteint sur un signal VC explicite et déjà gouverné par le périmètre
          learner_state. La règle consomme ce signal ; elle ne calcule pas la VC, n’infère pas la motivation
          et ne produit aucune interprétation psychologique autonome.
        effect: Révision de la contextualisation, des enjeux ou du lien au contexte authentique ; difficulté,
          seuils de maîtrise, règles d’évaluation et philosophie adaptative inchangés.
        scope: patch_governance
  - _source_core: constitution
    _source_section: RULES
    _matched_id: RULE_AR_REFRACTORY_PROFILE_TRIGGERS_SOLLICITATION_PATCH
    entry:
      id: RULE_AR_REFRACTORY_PROFILE_TRIGGERS_SOLLICITATION_PATCH
      authority: primary
      core_type: CONSTITUTION
      source_anchor: '[S7]'
      depends_on:
      - TYPE_SELF_REPORT_AR_N1
      - REF_CORE_LEARNIT_REFERENTIEL_V5_0_IN_CONSTITUTION
      relations:
