  - _source_core: constitution
    _source_section: TYPES
    _matched_id: TYPE_PATCH_IMPACT_SCOPE
    entry:
      id: TYPE_PATCH_IMPACT_SCOPE
      authority: primary
      core_type: CONSTITUTION
      source_anchor: '[S14]'
      depends_on: []
      relations: []
      patchable: false
      parameterizable: false
      human_readable: Attribut obligatoire de tout patch.
      logic:
        trigger: Validation d'un patch
        condition: 'Impact_scope calculable déterministiquement : l''impact_scope est défini comme l''ensemble
          structurel des IDs affectés par le patch, calculable par diff déterministe sur les fichiers
          cibles (aucune évaluation sémantique ou pédagogique n''est autorisée dans ce calcul).

          '
        effect: 'Autorisation de poursuivre la validation locale si et seulement si l''ensemble des IDs
          affectés est calculable structurellement. Toute évaluation sémantique ou interprétative nécessaire
          est déplacée dans la chaîne hors session de QA pédagogique, conformément à INV_PATCH_LOCAL_VALIDATION_MUST_BE_DETERMINISTIC.

          '
        scope: patch_validation
  - _source_core: constitution
    _source_section: TYPES
    _matched_id: TYPE_PATCH_QUALITY_GATE
    entry:
      id: TYPE_PATCH_QUALITY_GATE
      authority: primary
      core_type: CONSTITUTION
      source_anchor: '[S14]'
      depends_on: []
      relations:
      - type: validates
        target:
          id: TYPE_PATCH_ARTIFACT
      patchable: false
      parameterizable: false
      human_readable: Vérificateur local déterministe de la qualité déclarée d’un patch, fondé sur une
        preuve de QA pédagogique précomputée hors session.
      logic:
        trigger: Validation d’un patch
        condition: Une preuve de QA pédagogique hors session est présente, intègre, liée au même impact_scope,
          aux mêmes empreintes de sources et à la même version d’artefact que le patch soumis. Le runtime
          local ne décide jamais sémantiquement de la qualité pédagogique ; il vérifie seulement des critères
          déterministes de présence, intégrité, cohérence de portée, version, fraîcheur et statut déclaré.
        effect: Validation locale du patch uniquement si la preuve précomputée est déterministiquement
          vérifiable ; rejet local si la preuve manque, diverge de l’impact_scope, ne correspond pas aux
          empreintes de sources déclarées, est expirée ou porte un statut de QA défavorable. Aucune évaluation
          sémantique ou pédagogique n’est effectuée localement.
        scope: patch_validation
  - _source_core: constitution
    _source_section: INVARIANTS
    _matched_id: INV_NO_PARTIAL_PATCH_STATE
    entry:
