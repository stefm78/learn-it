        target:
          id: ACTION_TRIGGER_AR_SOLLICITATION_PATCH
      patchable: false
      parameterizable: true
      human_readable: Une fenêtre observable de non-réponse AR déclenche une adaptation non punitive du
        mode de sollicitation.
      logic:
        trigger: Fenêtre observable de non-réponse AR, sans interprétation psychologique.
        condition: Fenêtre de non-réponse atteinte sur un signal AR explicite et déjà gouverné. La règle
          ne diagnostique pas un profil psychologique, n’infère pas l’intention du learner et n’autorise
          aucune pénalisation.
        effect: Patch non punitif du format, de la cadence ou du canal de sollicitation AR, sans pression
          comportementale, sans baisse de difficulté et sans inférence psychologique autonome.
        scope: patch_governance
  - _source_core: constitution
    _source_section: RULES
    _matched_id: RULE_PERSISTENT_DRIFT_BLOCKED_PATCH_ESCALATES_OFFSESSION
    entry:
      id: RULE_PERSISTENT_DRIFT_BLOCKED_PATCH_ESCALATES_OFFSESSION
      authority: primary
      core_type: CONSTITUTION
      source_anchor: '[ARBITRAGE_2026_04_01][DRIFT-ESC-02]'
      depends_on:
      - INV_PERSISTENT_DRIFT_REQUIRES_ESCALATION_IF_PATCH_BLOCKED
      - ACTION_ESCALATE_PERSISTENT_DRIFT_OFFSESSION
      relations:
