      human_readable: Un patch partiellement appliqué constitue un état interdit.
      logic:
        trigger: Application d’un patch
        condition: Atomicité non garantie ou échec intermédiaire.
        effect: Patch annulé ou rollback obligatoire. Si le rollback ne peut pas être vérifié comme complet,
          toute nouvelle application de patch est bloquée et une escalade hors session de réparation d’intégrité
          devient obligatoire.
        scope: patch_layer
