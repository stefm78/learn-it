        target:
          id: ACTION_ESCALATE_PERSISTENT_DRIFT_OFFSESSION
      patchable: false
      parameterizable: false
      human_readable: Une dérive persistante non patchable localement doit déboucher sur une action d’escalade
        hors session explicitement matérialisée.
      logic:
        trigger: Persistance d’un besoin de correction non résoluble par patch local valide.
        condition: Le patch requis reste rejeté, impossible, bloqué par validation locale, ou s’avère
          inefficace après le nombre maximum autorisé d’itérations valides. Les causes learner_state ou
          gouvernance plus larges sont consommées comme signaux externes et ne sont pas redéfinies par
          cette règle.
        effect: Ouverture d’une escalade hors session avec payload minimal ; aucun maintien implicite
          dans un état de dérive non traité.
        scope: patch_governance
  - _source_core: constitution
    _source_section: RULES
    _matched_id: RULE_PATCH_SERIALIZATION
    entry:
      id: RULE_PATCH_SERIALIZATION
      authority: primary
      core_type: CONSTITUTION
      source_anchor: '[PATCH_LIFECYCLE_R01][C01]'
      depends_on:
      - TYPE_PATCH_ARTIFACT
      - ACTION_TRIGGER_RELEVANCE_PATCH
      - ACTION_TRIGGER_AR_SOLLICITATION_PATCH
      relations:
      - type: constrains
        target:
          id: TYPE_PATCH_ARTIFACT
      patchable: false
      parameterizable: false
      human_readable: 'Un seul patch actif par apprenant à un instant donné ; tout déclenchement concurrent
        est sérialisé en file d''attente FIFO.

        '
      logic:
        trigger: Déclenchement simultané de plusieurs actions de patch
        condition: 'Plusieurs actions de patch (ACTION_TRIGGER_RELEVANCE_PATCH, ACTION_TRIGGER_AR_SOLLICITATION_PATCH
          ou toute future action TYPE_PATCH_ARTIFACT) sont déclenchées pour le même apprenant avant qu''un
          patch actif soit terminé (appliqué, rejeté ou rollbacké).

          '
        effect: 'Un seul patch est traité à la fois par apprenant. Les déclenchements concurrents sont
          placés en file d’attente FIFO. Aucun patch concurrent ne peut démarrer tant que le patch actif
          n’a pas atteint un état terminal déterministe : appliqué, rejeté, rollbacké, ou bloqué après
          échec vérifié du rollback avec escalade hors session. Le rollback du patch actif relève du traitement
          terminal immédiat de ce patch, et non d’un nouveau patch à placer en file FIFO.'
        scope: patch_governance
